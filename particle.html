<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Hand-Controlled Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #info { position: absolute; top: 10px; left: 10px; color: white; pointer-events: none; z-index: 10; }
        canvas { display: block; }
        #video-container { position: absolute; bottom: 10px; right: 10px; width: 200px; border: 2px solid #444; border-radius: 8px; overflow: hidden; transform: scaleX(-1); }
        video { width: 100%; display: block; }
    </style>
</head>
<body>
    <div id="info">
        <h2>Hand Gesture Particles</h2>
        <p>Pinch Thumb & Index: Morph Shape</p>
        <p>Hand Distance to Camera: Expand System</p>
    </div>
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const particleCount = 5000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        
        // Templates
        const templates = {
            sphere: (i) => {
                const phi = Math.acos(-1 + (2 * i) / particleCount);
                const theta = Math.sqrt(particleCount * Math.PI) * phi;
                return new THREE.Vector3(Math.cos(theta) * Math.sin(phi), Math.sin(theta) * Math.sin(phi), Math.cos(phi)).multiplyScalar(5);
            },
            heart: (i) => {
                const t = (i / particleCount) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                return new THREE.Vector3(x * 0.3, y * 0.3, (Math.random() - 0.5) * 2);
            },
            saturn: (i) => {
                if (i < particleCount * 0.6) { // Sphere core
                    return templates.sphere(i).multiplyScalar(0.6);
                } else { // Rings
                    const angle = Math.random() * Math.PI * 2;
                    const r = 5 + Math.random() * 2;
                    return new THREE.Vector3(Math.cos(angle) * r, (Math.random() - 0.5) * 0.5, Math.sin(angle) * r);
                }
            }
        };

        let currentTarget = 'sphere';
        for (let i = 0; i < particleCount; i++) {
            const p = templates.sphere(i);
            positions[i * 3] = p.x;
            positions[i * 3 + 1] = p.y;
            positions[i * 3 + 2] = p.z;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ size: 0.05, vertexColors: true, transparent: true, opacity: 0.8 });
        const points = new THREE.Points(geometry, material);
        scene.add(points);

        camera.position.z = 20;

        // --- MEDIAPIPE HANDS SETUP ---
        const videoElement = document.getElementById('webcam');
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        let handX = 0, handY = 0, pinchDist = 0;

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                // Map MediaPipe (0-1) to Three.js world space
                handX = (landmarks[8].x - 0.5) * 40;
                handY = (0.5 - landmarks[8].y) * 20;
                
                // Pinch detection (Thumb tip to Index tip)
                const dx = landmarks[4].x - landmarks[8].x;
                const dy = landmarks[4].y - landmarks[8].y;
                pinchDist = Math.sqrt(dx*dx + dy*dy);

                // Morph shape if pinched
                if (pinchDist < 0.05) {
                    const keys = Object.keys(templates);
                    const nextIdx = (keys.indexOf(currentTarget) + 1) % keys.length;
                    currentTarget = keys[nextIdx];
                }
            }
        });

        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        cameraFeed.start();

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const posAttr = geometry.attributes.position;
            const colorAttr = geometry.attributes.color || new THREE.BufferAttribute(new Float32Array(particleCount * 3), 3);
            
            for (let i = 0; i < particleCount; i++) {
                const target = templates[currentTarget](i);
                
                // Smooth Lerp to target shape
                posAttr.array[i * 3] += (target.x - posAttr.array[i * 3]) * 0.1;
                posAttr.array[i * 3 + 1] += (target.y - posAttr.array[i * 3 + 1]) * 0.1;
                posAttr.array[i * 3 + 2] += (target.z - posAttr.array[i * 3 + 2]) * 0.1;

                // Color shift based on hand position
                colorAttr.array[i * 3] = 0.5 + Math.sin(handX * 0.1) * 0.5;
                colorAttr.array[i * 3 + 1] = 0.5 + Math.cos(handY * 0.1) * 0.5;
                colorAttr.array[i * 3 + 2] = 1.0 - pinchDist * 5;
            }

            posAttr.needsUpdate = true;
            if (!geometry.attributes.color) geometry.setAttribute('color', colorAttr);
            colorAttr.needsUpdate = true;

            points.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
